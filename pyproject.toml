[project]
name = "burrowl"
version = "2.1.7"
description = "AI 原生的研发记录与记忆：原件、判断、框架三列，只追加的账本加可再生的框架"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "typer>=0.12",
    "mcp>=1.10",
    "pypdfium2>=5.15.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "openpyxl>=3.1",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
    "numpy>=2.0",
    "pywinpty>=3.1,<4; sys_platform == 'win32'",
]

[project.scripts]
burrowl = "burrowl.interfaces.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "import-linter>=2.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/burrowl"]
# 前端构建产物被 .gitignore 排除，但必须进入 wheel
artifacts = ["src/burrowl/web/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]

[tool.importlinter]
root_package = "burrowl"

[[tool.importlinter.contracts]]
name = "分层：interfaces → services → store/index → core"
type = "layers"
layers = ["burrowl.interfaces", "burrowl.services", "burrowl.store | burrowl.index", "burrowl.core"]

[tool.ruff.lint.per-file-ignores]
"src/burrowl/interfaces/ops.py" = ["E501"]
"tests/*" = ["E501"]  # 测试里的中文样例按行写更直观  # 参数说明写在注解里，按行断开反而难读
